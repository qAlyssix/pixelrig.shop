{% extends 'base.html' %}

{% block title %}Регистрация — PixelRig{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Регистрация</h1>

    <form method="post">
        <div class="form-group">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username"
                   value="{{ username or '' }}" maxlength="50" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   value="{{ email or '' }}" maxlength="120" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" minlength="6" required>
        </div>

        <div class="form-group">
            <label for="password2">Повторите пароль</label>
            <input type="password" id="password2" name="password2" minlength="6" required>
        </div>

        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>

    <p class="form-footer">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</div>
{% endblock %}
